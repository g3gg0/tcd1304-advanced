name: Build firmware

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        run: make

      - name: Collect binaries
        run: |
          mkdir -p dist
          cp .pio/build/nucleo_f411re/firmware.bin dist/tcd1304-advanced.bin
          cp .pio/build/nucleo_f411re/firmware.elf dist/tcd1304-advanced.elf
          cp .pio/build/nucleo_f411re/firmware.hex dist/tcd1304-advanced.hex

      - uses: actions/upload-artifact@v4
        with:
          name: tcd1304-advanced-firmware
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tcd1304-advanced.bin
            dist/tcd1304-advanced.hex
